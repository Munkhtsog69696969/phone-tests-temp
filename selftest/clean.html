<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>clean</title>
<style>
html,body{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.drawer{position:fixed;top:0;left:0;bottom:0;width:280px;transform:translateX(-100%)}
.drawer button{width:200px;height:48px;font-size:16px}
.scroller{overflow-x:auto;white-space:nowrap}
.scroller button{width:300px;height:48px;font-size:16px;display:inline-block}
main{padding:20px 20px 120px}
button.big,input{font-size:16px;min-height:48px;box-sizing:border-box}
</style></head>
<body>
<div class="sr"><a href="#main">Skip link for screen readers</a></div>
<div class="drawer"><button>Off-screen drawer item</button><div style="height:300px;overflow-y:auto;width:200px"><div style="height:900px">Tall list in a closed drawer</div></div></div>
<main id="main">
<p>Plain page with lookalikes that must not be flagged. <a href="#x">Inline link</a> inside text.</p>
<input type="text" placeholder="16px input" style="width:100%">
<div class="scroller" style="margin-top:16px"><button>Scrolls sideways one</button><button>Scrolls sideways two</button></div>
<button class="big" style="margin-top:16px;width:100%">Normal button</button>
<div style="height:120px;overflow-y:auto;margin-top:16px"><button class="big" style="width:100%">Item 1</button><button class="big" style="width:100%">Item 2</button><button class="big" style="width:100%">Item 3</button><button class="big" style="width:100%">Item 4, scrolled away</button></div>
<div style="background:#eee;padding:12px;position:relative;margin-top:-1px">Box right below a scroll box</div>
</main>
<nav data-tour="bottom-nav" style="position:fixed;bottom:0;left:0;right:0;height:68px;background:#ddd"></nav>
</body></html>
